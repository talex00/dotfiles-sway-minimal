# XSETTINGS для сессии sway-satellite (дисплей :12, масштаб 1.5 -> DPI 144).
# Xft/DPI в единицах 1/1024 pt: 144*1024 = 147456.
# satellite уступает место внешнему менеджеру (см. README xwayland-satellite).
Xft/DPI 147456
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
Gdk/WindowScalingFactor 1
