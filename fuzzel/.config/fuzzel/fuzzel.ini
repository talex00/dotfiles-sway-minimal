font=JetBrains Mono:size=12
prompt="> "
# Тема иконок нужна явно: icons-enabled и так включён по умолчанию, но тема по
# умолчанию — hicolor, а он почти пустой, и список выглядит вообще без иконок.
icon-theme=Adwaita
width=35
horizontal-pad=8
vertical-pad=0
inner-pad=0
# Цвета — в theme.ini (её пишет scripts/look.sh). include возможен только в
# [main], и секцию [colors] здесь дублировать нельзя: объявленная ниже она
# побеждала бы тему.
include=~/.config/fuzzel/theme.ini

[border]
width=1
radius=0
