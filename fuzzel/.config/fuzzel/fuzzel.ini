font=JetBrains Mono:size=12
prompt="> "
# Тема иконок нужна явно: icons-enabled и так включён по умолчанию, но тема по
# умолчанию — hicolor, а он почти пустой, и список выглядит вообще без иконок.
icon-theme=Adwaita
width=35
horizontal-pad=8
vertical-pad=0
inner-pad=0

[colors]
background=ffffffff
text=000000ff
match=ff0000ff
selection=eeeeeeff
selection-text=000000ff
border=000000ff

[border]
width=1
radius=0
