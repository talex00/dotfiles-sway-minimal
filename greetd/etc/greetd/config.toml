[terminal]
# Виртуальный терминал для экрана входа
vt = 1

[default_session]
# Запуск tuigreet: меню пользователей, время и единственная сессия Sway.
# Сессия лежит только в /usr/local/share/wayland-sessions (флаг --sessions
# заменяет дефолтную разводку по XDG_DATA_DIRS, так что пакетный sway.desktop
# не дублируется). X11 в ней всегда через xwayland-satellite: DISPLAY и
# WLR_BACKENDS задаёт sway.sh — единственное такое место (см. комментарий там).
# --cmd — страховка на случай пустого/устаревшего кэша выбора сессии.
command = "tuigreet --time --user-menu --remember --asterisks --sessions /usr/local/share/wayland-sessions --cmd /usr/local/share/wayland-sessions/sway.sh"

# Пользователь, от имени которого работает экран входа
user = "greeter"
