[main]
shell=/usr/bin/fish
font=JetBrainsMono Nerd Font:size=11, Symbols Nerd Font Mono:size=11
pad=15x15
# Палитра — в theme.ini (её пишет scripts/look.sh): include возможен только в
# [main]. foot 1.16 из noble знает лишь секцию [colors] и не умеет переключать
# темы сигналами — поэтому цвета применяются к новым окнам.
include=~/.config/foot/theme.ini
