[main]
font=JetBrains Mono:size=11
pad=15x15

# Палитра светлая, но лежит в [colors-dark]: с foot 1.26 секция [colors] устарела
# и спамит предупреждением в каждом окне, а [colors-dark] активна по умолчанию.
# Дублировать её в [colors-light] не нужно — переключения тем здесь нет.
[colors-dark]
background=ffffff
foreground=111111
regular0=111111
regular1=cc372c
regular2=32a032
regular3=9e8000
regular4=245bc3
regular5=953b9d
regular6=0093a3
regular7=bbbbbb
bright0=777777
bright1=e34d3d
bright2=42b142
bright3=c2a000
bright4=3271d9
bright5=b04eb9
bright6=00adbc
bright7=ffffff
