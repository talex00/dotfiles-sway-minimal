[main]
shell=/usr/bin/fish
font=JetBrains Mono:size=11, Noto Color Emoji:size=11, JetBrainsMono Nerd Font:size=11, Font Awesome 6 Free:size=11, Font Awesome 5 Free:size=11, FontAwesome:size=11, monospace:size=11
pad=15x15
# Палитра — в theme.ini (её пишет scripts/look.sh): include возможен только в
# [main]. foot 1.16 из noble знает лишь секцию [colors] и не умеет переключать
# темы сигналами — поэтому цвета применяются к новым окнам.
include=~/.config/foot/theme.ini

[tweak]
font-monospace-warn=no
