# Generated as analogue of hyprland/monitors.conf
# (can be regenerated with nwg-displays for sway)

# Внешний монитор (если подключён — основной, 240 Гц, 10-bit).
# Sway просто пропустит эту строку, если выход отсутствует.
output DP-1 mode 1920x1080@240.0Hz pos 0 0 scale 1.0 render_bit_depth 10

# Встроенный экран:
#   - если DP-1 подключён: выключаем eDP-1 (оставляем только внешний)
#   - если DP-1 не подключён: используем eDP-1 как основной
# Условие проверяется через swaybar/wlroots во время чтения конфига
# штатно нельзя, поэтому используем exec-обёртку: при старте sway
# динамически применяем нужный набор правил через swaymsg.
# (См. ~/.config/sway/scripts/monitors-fallback.sh)
