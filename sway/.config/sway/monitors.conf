# Конфигурация мониторов. МАШИННО-СПЕЦИФИЧНО — отредактируй под свои выходы
# или сгенерируй через nwg-displays (он пишет сюда же при -o ~/.config/sway/monitors.conf).
# Имена выходов смотри: swaymsg -t get_outputs

# Встроенный экран выключен
output eDP-1 disable

# Внешний монитор: 1920x1080@240, позиция 0 0, scale 1, 10-bit
output DP-1 mode 1920x1080@240.0Hz pos 0 0 scale 1.0 render_bit_depth 10